
<!-- BARRA SUPERIOR DE CONTACTO -->
<div class="kasal-topbar">
  <div class="container">
    <div class="kasal-topbar-content">

      <a href="tel:+51992777951">
        <i class="bi bi-telephone-fill"></i>
        +51 992 777 951
      </a>

      <a href="mailto:ventas@kasalinversiones.com">
        <i class="bi bi-envelope-fill"></i>
        ventas@kasalinversiones.com
      </a>

    </div>
  </div>
</div>

<!-- NAVEGACIÓN PRINCIPAL -->
<nav
  class="navbar navbar-expand-lg navbar-light kasal-navbar sticky-top shadow-sm"
>
  <div class="container">

    <!-- LOGO -->
    <a
      class="navbar-brand d-flex align-items-center"
      routerLink="/"
      aria-label="KASAL Inversiones - Inicio"
    >
      <img
        src="/images/logo-kasalv1.png"
        alt="KASAL Inversiones"
        class="kasal-navbar-logo"
      >
    </a>

    <!-- MENÚ MÓVIL -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu"
      aria-controls="navMenu"
      aria-expanded="false"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- ENLACES -->
    <div
      class="collapse navbar-collapse"
      id="navMenu"
    >

      <ul
        class="navbar-nav mx-auto mb-2 mb-lg-0 text-uppercase fw-bold"
      >

        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/tienda"
            routerLinkActive="active"
          >
            Tienda / Catálogo
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/cotizacion"
            routerLinkActive="active"
          >
            Cotización
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/contacto"
            routerLinkActive="active"
          >
            Contacto
          </a>
        </li>

      </ul>

      <!-- CARRITO / COTIZACIÓN -->
      <div class="kasal-navbar-actions">

        <button
          class="btn kasal-cart-btn d-flex align-items-center gap-2 position-relative"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#carritoOffcanvas"
          aria-controls="carritoOffcanvas"
        >
          <i class="bi bi-cart3 fs-5"></i>

          <span>Mi cotización</span>

          <span
            *ngIf="cantidadCarrito > 0"
            class="badge bg-dark text-white rounded-pill"
          >
            {{ cantidadCarrito }}
          </span>

        </button>

      </div>

    </div>

  </div>
</nav>
