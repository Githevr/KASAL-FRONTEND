<div class="admin-login-page">

  <div class="admin-login-card">

    <a
      routerLink="/"
      class="volver"
    >
      ← Volver a la tienda
    </a>

    <div class="encabezado">

      <span class="etiqueta">
        Administración
      </span>

      <h1>
        KASAL INVERSIONES
      </h1>

      <p>
        Ingresa tus credenciales para acceder
        al panel administrativo.
      </p>

    </div>

    <form
      (ngSubmit)="iniciarSesion()"
      #loginForm="ngForm"
    >

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="username"
          placeholder="Correo del administrador"
          required
          [disabled]="cargando"
        >

      </div>

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Contraseña"
          required
          [disabled]="cargando"
        >

      </div>

      <div
        *ngIf="error"
        class="mensaje-error"
      >
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="
          cargando ||
          loginForm.invalid
        "
      >

        <span *ngIf="!cargando">
          Iniciar sesión
        </span>

        <span *ngIf="cargando">
          Ingresando...
        </span>

      </button>

    </form>

  </div>

</div>
