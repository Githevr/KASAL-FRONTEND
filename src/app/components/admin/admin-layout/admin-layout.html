<div class="admin-layout">


  <!-- =====================================================
       OVERLAY
  ====================================================== -->

  <div
    class="menu-overlay"
    [class.activo]="menuAbierto"
    (click)="cerrarMenu()"
  ></div>


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="admin-sidebar"
    [class.abierto]="menuAbierto"
  >


    <!-- CABECERA -->

    <div class="sidebar-header">

      <div class="sidebar-logo">

        <div class="sidebar-logo-icono">
          <i class="bi bi-shield-check"></i>
        </div>

        <div>
          <strong>KASAL</strong>
          <span>INVERSIONES</span>
        </div>

      </div>


      <button
        type="button"
        class="sidebar-cerrar"
        (click)="cerrarMenu()"
        aria-label="Cerrar menú"
      >
        <i class="bi bi-x-lg"></i>
      </button>

    </div>


    <!-- USUARIO -->

    <div class="sidebar-usuario">

      <div class="usuario-icono">
        <i class="bi bi-person-fill"></i>
      </div>

      <div>
        <strong>Administrador</strong>
        <span>Panel de gestión</span>
      </div>

    </div>


    <!-- NAVEGACIÓN -->

    <nav class="sidebar-nav">

      <span class="sidebar-titulo">
        MENÚ PRINCIPAL
      </span>


      <!-- DASHBOARD -->

      <a
        routerLink="/admin"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="cerrarMenu()"
      >

        <i class="bi bi-grid-1x2-fill"></i>

        <span>
          Dashboard
        </span>

      </a>


      <!-- COTIZACIONES -->

      <a
        routerLink="/admin/cotizaciones"
        routerLinkActive="activo"
        (click)="cerrarMenu()"
      >

        <i class="bi bi-receipt"></i>

        <span>
          Cotizaciones
        </span>

      </a>


      <!-- PRODUCTOS -->

      <a
        routerLink="/admin/productos"
        routerLinkActive="activo"
        (click)="cerrarMenu()"
      >

        <i class="bi bi-box-seam-fill"></i>

        <span>
          Productos
        </span>

      </a>


      <!-- NUEVO PRODUCTO -->

      <!-- NUEVO PRODUCTO -->

<a
  routerLink="/admin/productos/nuevo"
  routerLinkActive="activo"
  [routerLinkActiveOptions]="{
    exact: true
  }"
  (click)="cerrarMenu()"
>

  <i class="bi bi-plus-square-fill"></i>

  <span>
    Nuevo producto
  </span>

</a>


      <!-- CATEGORÍAS -->

      <a
        routerLink="/admin/categorias"
        routerLinkActive="activo"
        (click)="cerrarMenu()"
      >

        <i class="bi bi-tags-fill"></i>

        <span>
          Categorías
        </span>

      </a>


      <!-- SECTORES -->

      <a
        routerLink="/admin/sectores"
        routerLinkActive="activo"
        (click)="cerrarMenu()"
      >

        <i class="bi bi-buildings-fill"></i>

        <span>
          Sectores
        </span>

      </a>

    </nav>


    <!-- CERRAR SESIÓN -->

    <div class="sidebar-footer">

      <button
        type="button"
        class="btn-cerrar-sesion-menu"
        (click)="cerrarSesion()"
      >

        <i class="bi bi-box-arrow-left"></i>

        <span>
          Cerrar sesión
        </span>

      </button>

    </div>

  </aside>


  <!-- =====================================================
       HEADER ADMIN
  ====================================================== -->

  <header class="admin-header">

    <div class="header-izquierda">

      <button
        type="button"
        class="btn-menu"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
      >

        <i class="bi bi-list"></i>

      </button>


      <div>

        <span>
          Panel administrativo
        </span>

        <h1>
          KASAL INVERSIONES
        </h1>

      </div>

    </div>


    <button
      type="button"
      class="btn-salir"
      (click)="cerrarSesion()"
    >

      <i class="bi bi-box-arrow-right"></i>

      <span>
        Cerrar sesión
      </span>

    </button>

  </header>


  <!-- =====================================================
       AQUÍ ANGULAR INSERTA LA PÁGINA ACTUAL
  ====================================================== -->

  <div class="admin-router-content">

    <router-outlet></router-outlet>

  </div>


</div>
